<meta charset="utf-8"><link rel="stylesheet" href="_tokens.css">
<style>
  .canvas { width: 1280px; height: 640px; }
  .rule { position: absolute; height: 1px; background: var(--rule); }
  .ramp { position: absolute; height: 8px; background: linear-gradient(to right,
      #440154,#472d7b,#3b528b,#2c728e,#21918c,#28ae80,#5ec962,#addc30,#fde725); }
  .mark { position:absolute; background: var(--accent); color: var(--accent-ink);
          display: flex; align-items: center; justify-content: center;
          font-weight: 700; font-size: 20px; letter-spacing: 0.02em; }
  .wm { position: absolute; font-size: 258px; letter-spacing: 0; line-height: 1;
        white-space: nowrap; font-weight: 700; color: var(--ink); }
  .raw { text-transform: none; }
  .chain { position: absolute; font-size: 15px; letter-spacing: 0.12em;
           color: var(--ink-2); line-height: 1; }
</style>
<body><div class="canvas">

  <div class="mark" style="left:80px; top:44px; width:40px; height:40px;">cj</div>
  <div class="lab"  style="position:absolute; left:136px; top:58px;">DIFFERENTIABLE CODE-FIRST CAD</div>
  <div class="lab"  style="position:absolute; right:80px; top:58px;">GITHUB.COM/ANDRINR/CADJOINT</div>

  <!-- the name is bigger than the frame: the wordmark is cropped by the edge -->
  <div class="wm" style="left:80px; top:64px;">cadjoint</div>

  <div class="rule"  style="left:80px; top:320px; width:1120px;"></div>
  <div class="chain" style="left:80px; top:344px;">ONE&nbsp;PURE&nbsp;JAX&nbsp;FUNCTION&nbsp;—&nbsp;SKETCH,&nbsp;CONSTRAINTS,&nbsp;SDF,&nbsp;MESH&nbsp;AND&nbsp;FEM,&nbsp;DIFFERENTIATED&nbsp;END&nbsp;TO&nbsp;END</div>
  <div class="reg" style="left:80px;   top:320px;"></div>
  <div class="reg" style="left:1200px; top:320px;"></div>

  <!-- full-bleed band: a live capture of the running viewport, cropped by the frame -->
  <div class="plate live" style="left:0; top:384px; width:1280px; height:256px;
       outline:0; border-top:1px solid #605e65; border-bottom:1px solid #605e65;">
    <img src="assets/hero-bleed.png" alt="">
    <!-- the legend and title block sit on empty floor, never over the field -->
    <div style="position:absolute; right:80px; top:22px; width:280px;">
      <div class="lab" style="color:#605e65;">FIELD · TEMPERATURE</div>
      <div class="ramp" style="position:relative; margin-top:8px; width:280px;"></div>
      <div class="lab" style="color:#605e65; margin-top:8px; display:flex; justify-content:space-between;"><span>0</span><span>1.134</span></div>
    </div>
    <div class="tblock live" style="right:80px; bottom:20px; width:198px;">
      <div><b>SCENE</b><span>starter.py</span></div>
      <div><b>STUDY</b><span>sink-conduction</span></div>
      <div><b>MESH</b><span>sink-mesh · tet10</span></div>
      <div><b>SOLVER</b><span>jax-fem</span></div>
      <div><b>REV</b><span>fd5a098</span></div>
    </div>
  </div>

</div><script src="plate.js"></script></body>
