name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: |
          # A constraint, not just a specifier on this line: the later
          # `pip install optax optimistix` resolves on its own and upgraded
          # jax past the cap (to 0.11.2) when it was only stated here.
          printf 'jax<0.9\njaxlib<0.9\n' > "$RUNNER_TEMP/jax-cap.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/jax-cap.txt"
          pip install "jax[cpu]>=0.4.20,<0.9" imageio numpy
          pip install -e . --no-deps
          pip install optax optimistix
          pip install "quartodoc>=0.7" "griffe<1.0"

      # The public demo (frontend/static.html), served at <site>/demo/. Its
      # scene bundle is committed and kept current by
      # tests/viewer/test_demo_bundle.py, so this needs Node and not the
      # scenes. It is built into demo/, which _quarto.yml lists as a
      # resource, so every render copies it into _site — the publish step
      # below renders again, and a copy made straight into _site would not
      # survive that. The build keeps its relative base ("./"): it works
      # under any path, and Quarto rewrites site-absolute url(/...) in the
      # CSS it copies into a broken path.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the public demo
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build:static
          rm -rf ../demo && cp -r dist-static ../demo

      - name: Build API reference
        run: quartodoc build

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
