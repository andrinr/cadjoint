name: docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Python dependencies
        run: |
          # A constraint, not just a specifier on this line: the later
          # `pip install optax optimistix` resolves on its own and upgraded
          # jax past the cap (to 0.11.2) when it was only stated here.
          printf 'jax<0.9\njaxlib<0.9\n' > "$RUNNER_TEMP/jax-cap.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/jax-cap.txt"
          pip install "jax[cpu]>=0.4.20,<0.9" imageio numpy
          pip install -e . --no-deps
          pip install optax optimistix
          pip install "quartodoc>=0.7" "griffe<1.0"

      - name: Build API reference
        run: quartodoc build

      - name: Render site
        run: quarto render

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
