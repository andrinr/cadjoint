name: release

# Publishes cadjoint to PyPI through Trusted Publishing (OIDC, no token).
#
# Versioning: the only version is `version` in pyproject.toml, semver with
# the pre-1.0 rule (a minor bump may break the API, a patch bump may not).
# Release by bumping it, running `uv lock`, merging, and pushing tag vX.Y.Z;
# the build refuses a tag that disagrees with pyproject.toml. A manual run
# is a dry run: it publishes X.Y.Z.devN to TestPyPI only.
#
# One-time setup: a pending publisher on pypi.org and on test.pypi.org
# (owner andrinr, repo cadjoint, workflow release.yml, environment pypi /
# testpypi), and the two GitHub environments, `pypi` with a required
# reviewer and limited to v* tags.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Resolve the version
        id: version
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${version}"
              exit 1
            fi
          else
            version="${version}.dev${GITHUB_RUN_NUMBER}"
            # count=1: [tool.uv] has version lines of its own.
            VERSION="$version" uv run --no-project python -c "import os, pathlib, re; p = pathlib.Path('pyproject.toml'); p.write_text(re.sub(r'(?m)^version = \".*\"', 'version = \"' + os.environ['VERSION'] + '\"', p.read_text(), count=1))"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # The sdist, then the wheel built from it.
      - run: uv build --out-dir dist
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The wheel alone in a clean venv, imported from outside the checkout.
  smoke:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: |
          uv venv --python ${{ matrix.python }} "$RUNNER_TEMP/venv"
          uv pip install --python "$RUNNER_TEMP/venv/bin/python" dist/*.whl
      - working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/venv/bin/python" -I "$GITHUB_WORKSPACE/.github/scripts/smoke_installed.py" \
            "${{ needs.build.outputs.version }}"

  testpypi:
    needs: smoke
    runs-on: ubuntu-24.04
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  pypi:
    if: github.event_name == 'push'
    needs: testpypi
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
