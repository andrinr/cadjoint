name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "jax[cpu]>=0.4.20"
          pip install -e ".[dev]" --no-deps
          pip install pytest scikit-image matplotlib optax optimistix pydantic

      # `tests/conftest.py` turns JAX's persistent compilation cache on for
      # every session, but a fresh runner has nothing in it, so this job paid
      # XLA for the same few thousand programs on every push. The cache is
      # keyed by the lowered HLO plus the backend and JAX version — it cannot
      # serve a stale executable for changed code, so carrying it between runs
      # is safe, and it is small: a whole directory measured 13 MB for 3330
      # entries. `github.run_id` in the key makes every run save a fresh
      # entry; `restore-keys` picks up the newest earlier one.
      - name: Restore the JAX compilation cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/cadjoint/jax
          key: cadjoint-jax-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            cadjoint-jax-${{ runner.os }}-py312-${{ hashFiles('pyproject.toml') }}-
            cadjoint-jax-${{ runner.os }}-py312-

      # The fast loop only. The `slow` marker is on the tests that take
      # minutes each because they extract a real mesh, run a real solve or a
      # real descent (tests/conftest.py). They are what makes the suite worth
      # running, but not on every push: with them in, this job runs for hours
      # and nobody waits for it, which is how the suite came to be broken for
      # weeks without anyone noticing. `nightly.yml` runs everything.
      - name: Run tests
        run: |
          pytest tests/ -q -m "not slow"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files
