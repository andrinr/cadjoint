name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install "jax[cpu]>=0.4.20"
          pip install -e ".[dev]" --no-deps
          pip install pytest scikit-image matplotlib optax optimistix pydantic

      # The fast loop only. The `slow` marker is on the tests that take
      # minutes each because they extract a real mesh, run a real solve or a
      # real descent (tests/conftest.py). They are what makes the suite worth
      # running, but not on every push: with them in, this job runs for hours
      # and nobody waits for it, which is how the suite came to be broken for
      # weeks without anyone noticing. `nightly.yml` runs everything.
      #
      # `--durations` because the marking is not finished: tests/fem,
      # tests/flow and tests/viewer carry no markers at all and
      # tests/meshing only above 93 s, so this job is still tens of
      # minutes rather than the seconds tests/sdf manages. A clean
      # runner is the only place to measure that honestly — a laptop
      # with agents on it inflates everything by an unknown factor.
      - name: Run tests
        run: |
          pytest tests/ -q -m "not slow" --durations=25

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files
