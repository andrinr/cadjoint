name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Five CI runs raced on main inside ten minutes on 2026-09-09, each one a
# 50-minute job computing the same answer. Supersede instead of piling up.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Bounded, and far below the six-hour default. Every `test` job in this
    # repository's recorded history ran 33 to 55 minutes and then ended with
    # "The runner has received a shutdown signal" — no summary, no failing
    # test, nothing to act on, because `-q` prints one line per 72 tests and
    # the last 20 minutes produced no line at all. A timeout gives a name
    # and a duration instead.
    #
    # 45 and not 10 because 10 would be a lie today. Measured on a cold
    # runner, the first 34% of this selection costs 1319 s, and almost all of
    # that is XLA compilation rather than test work — a stack sample of the
    # same suite locally sits in LLVM and MLIR, not in numerics. So the honest
    # cold figure is roughly half an hour, and the way it comes down is the
    # cache below doing its job across runs, not this number being optimistic.
    # Lower it when a warm run has been measured.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          # The same series pyproject.toml caps at. Unbounded, this pulled
          # jax 0.11 the day it appeared and turned main red on six tests that
          # pass on the locked 0.8.2.
          # A constraint, not just a specifier on this line: the later
          # `pip install optax optimistix` resolves on its own and upgraded
          # jax past the cap (to 0.11.2) when it was only stated here.
          printf 'jax<0.9\njaxlib<0.9\n' > "$RUNNER_TEMP/jax-cap.txt"
          export PIP_CONSTRAINT="$RUNNER_TEMP/jax-cap.txt"
          pip install "jax[cpu]>=0.4.20,<0.9"
          pip install -e ".[dev]" --no-deps
          pip install pytest pytest-xdist scikit-image matplotlib optax optimistix pydantic

      # `tests/conftest.py` turns JAX's persistent compilation cache on for
      # every session, but a fresh runner starts with nothing in it, so this
      # job paid XLA for the same few thousand programs on every push. The
      # cache is keyed by the lowered HLO plus the backend and JAX version,
      # so it cannot serve a stale executable for changed code — carrying it
      # between runs is safe, and a miss costs only what today already costs.
      # `github.run_id` makes every run save a fresh entry; `restore-keys`
      # picks up the newest earlier one.
      #
      # Restore and save are separate steps because `actions/cache` saves
      # only after a successful job, and no run had succeeded: every one was
      # cancelled at the timeout or by a newer push, so the cache was never
      # written and every run started cold ("Cache not found", #53). The save
      # below runs whatever the outcome, so even a failing run warms the next.
      # XLA compiles CPU executables for the host it runs on, and the
      # persistent cache key does not record which CPU that was. GitHub's
      # runners are not one model, so an entry written on one and read on
      # another can compute differently: a run restoring cec2472's cache
      # failed two knife-edge tests that cec2472 itself passed, with the
      # same code and the same packages, twice in a row. The CPU model is in
      # the key, so a run only ever reads executables built for its own CPU.
      - name: Identify the runner CPU
        id: cpu
        run: |
          model=$(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2- | sed 's/^ *//')
          echo "CPU: $model"
          echo "id=$(echo "$model" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Restore the JAX compilation cache
        id: jax-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/cadjoint/jax
          key: cadjoint-jax-${{ runner.os }}-${{ steps.cpu.outputs.id }}-py312-${{ hashFiles('pyproject.toml') }}-${{ github.run_id }}
          restore-keys: |
            cadjoint-jax-${{ runner.os }}-${{ steps.cpu.outputs.id }}-py312-${{ hashFiles('pyproject.toml') }}-
            cadjoint-jax-${{ runner.os }}-${{ steps.cpu.outputs.id }}-py312-

      # The fast loop only. The `slow` marker is on the tests that take
      # minutes each because they extract a real mesh, run a real solve or a
      # real descent (tests/conftest.py). They are what makes the suite worth
      # running, but not on every push: with them in, this job runs for hours
      # and nobody waits for it, which is how the suite came to be broken for
      # weeks without anyone noticing. `nightly.yml` runs everything.
      #
      # `-v`, not `-q`, and that is the whole lesson of the nine failures this
      # replaces. `-q` emits one line per 72 tests, so a job killed mid-line
      # says nothing at all about where it was — every one of those failures
      # ended after 18 to 26 minutes of total log silence. One line per test
      # costs a few hundred kilobytes of log and means the last line names the
      # test that was running. `--durations` is so the cost stays visible
      # before it creeps back into another 50-minute job.
      #
      # `-n auto` runs one worker per core. The suite is CPU-bound -- 22 CPU
      # minutes in 15.6 wall minutes on one process locally -- and the
      # plugin tests give each worker its own port range
      # (tests/plugins/conftest.py), so the workers do not collide.
      - name: Run tests
        run: |
          pytest tests/ -v -m "not slow" -n auto --durations=25

      - name: Save the JAX compilation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/cadjoint/jax
          key: ${{ steps.jax-cache.outputs.cache-primary-key }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit hooks
        run: pre-commit run --all-files

  # The test job installs with pip, so nothing else here reads uv.lock -- it
  # went stale once a dev extra changed and every `uv sync` then re-resolved,
  # which is how issue #43 reached users. `--check` resolves without writing
  # and fails when the lock no longer matches pyproject.toml. The compilers
  # are pointed at `false` so a resolution that tries to build an sdist (the
  # petsc4py trap the static metadata in pyproject.toml exists to avoid)
  # fails here instead of compiling PETSc for minutes on someone's laptop.
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Check uv.lock is current
        env:
          CC: "false"
          CXX: "false"
          FC: "false"
        run: uv lock --check
