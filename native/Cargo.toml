[package]
name = "cadjoint-native-mesher"
version = "0.1.0"
edition = "2021"
description = "Native (rayon-parallel) core of the cadjoint differentiable dual-contouring mesher"
license = "MIT"

[lib]
name = "cadjoint_native_mesher"
crate-type = ["cdylib"]

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
