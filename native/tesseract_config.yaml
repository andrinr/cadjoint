# Tesseract configuration file (tesseract-core 1.11 contract: a Tesseract
# package is tesseract_api.py + tesseract_config.yaml + a requirements file
# in one directory; `tesseract build <dir>` turns it into a Docker image).

name: "cadjoint_qef_native"
version: "0.1.0"
description: >-
  Batched Tikhonov QEF vertex solve of the native (Rust) dual-contouring
  core, with a hand-derived linear-solve vector_jacobian_product computed
  in the cdylib. One unclamped vertex per incidence row; the caller
  applies the per-cell clamp in JAX.

# Point cadjoint.meshing.native at the cdylib built inside the image: the
# pip-installed cadjoint has no repo-relative native/target/release to look in,
# so _library_candidates() falls back to this override.
env:
  CADJOINT_NATIVE_MESHER: "/tesseract/libcadjoint_native_mesher.so"

build_config:
  python_version: "3.12"
  # Debian bookworm (the SDK default base image) ships cargo 0.66/rustc 1.63,
  # which cannot read this crate's Cargo.lock (lockfile format v4 needs cargo
  # >= 1.78). Trixie ships cargo 1.85, so the pinned lockfile is honoured and
  # the build stays reproducible. Trixie is Debian-based, as base_image
  # requires; the Python interpreter comes from python_version above, not from
  # the base image, so bumping the base costs nothing on the Python side.
  base_image: "debian:trixie-slim"
  # The Rust cdylib is compiled inside the image via the documented custom
  # build hook ("Custom steps to run during `docker build` (after everything
  # else is installed)"). These lines are injected verbatim into the run stage,
  # while it is still USER root and before the entrypoint check, so the crate
  # sources can be copied out of the build context and the artifact dropped in
  # /tesseract. The build context's __tesseract_source__/ is a copy of this
  # directory, hence Cargo.toml + src/ are addressable as COPY sources.
  #
  # ca-certificates is not in the slim base image, and without it cargo cannot
  # reach https://index.crates.io. The Rust toolchain is installed, used, and
  # purged inside a single RUN so it never lands in a shipped layer; a Rust
  # cdylib links libstd statically, so nothing from the toolchain is needed at
  # run time.
  custom_build_steps:
    - 'COPY ["__tesseract_source__/Cargo.toml", "__tesseract_source__/Cargo.lock", "/tmp/native-build/"]'
    - 'COPY ["__tesseract_source__/src", "/tmp/native-build/src"]'
    - >-
      RUN apt-get update
      && apt-get install -y --no-install-recommends cargo ca-certificates
      && cd /tmp/native-build && cargo build --release --locked
      && cp target/release/libcadjoint_native_mesher.so /tesseract/
      && chmod 444 /tesseract/libcadjoint_native_mesher.so
      && apt-get purge -y cargo && apt-get autoremove -y
      && rm -rf /tmp/native-build /root/.cargo /var/lib/apt/lists/*
