[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jaxcad"
version = "0.1.0"
description = "Fully differentiable CAD software built with JAX"
license = { text = "Elastic-2.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imageio>=2.37.2",
    "jax>=0.4.20",
    "numpy>=1.24.0",
    "optax>=0.2.4",
    "optimistix>=0.0.10",
]

[project.scripts]
jaxcad-viewer = "jaxcad.viewer.playground:main"

[project.optional-dependencies]
# CPU JAX is the default so the package installs on macOS and CPU-only Linux.
# Install this extra on a Linux box with an NVIDIA GPU (no macOS wheels exist).
cuda = ["jax[cuda12]>=0.4.20"]
glsl = ["moderngl>=5.12.0"]
viewer = ["anywidget>=0.9.21"]
dev = [
    "pytest>=7.0.0",
    "pre-commit>=3.0.0",
    "matplotlib>=3.7.0",
]
docs = [
    "quartodoc>=0.7",
    "griffe<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["jaxcad*"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.8.0",
    "pre-commit>=3.0.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "NPY",    # NumPy-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM"]
"examples/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
