[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadjoint"
version = "0.1.0"
description = "Fully differentiable CAD software built with JAX"
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "imageio>=2.37.2",
    "jax>=0.4.20",
    "numpy>=1.24.0",
    "optax>=0.2.4",
    "optimistix>=0.0.10",
]

[project.scripts]
cadjoint-viewer = "cadjoint.viewer.playground:main"

# Third-party solvers, meshers and other components register here: expose an
# object that is a cadjoint.plugins.PluginSpec, a mapping in the plugins.toml
# table form, or a callable returning either. See docs/plugins.qmd. cadjoint's
# own components are discovered as built-ins, not through this group.
[project.entry-points."cadjoint.plugins"]

[project.optional-dependencies]
# CPU JAX is the default so the package installs on macOS and CPU-only Linux.
# Install this extra on a Linux box with an NVIDIA GPU (no macOS wheels exist).
cuda = ["jax[cuda12]>=0.4.20"]
# jax-fem 0.0.12 ships an empty install_requires, so its actual imports
# (basix, meshio, gmsh, petsc4py, pyfiglet, scipy) are listed here explicitly.
# The python_version markers keep uv's universal resolution working for the
# project's full >=3.9 range: these solver stacks only support newer Pythons.
fem = [
    "jax-fem; python_version >= '3.11'",
    "fenics-basix; python_version >= '3.11'",
    "meshio; python_version >= '3.11'",
    "gmsh; python_version >= '3.11'",
    "petsc4py; python_version >= '3.11'",
    "pyfiglet; python_version >= '3.11'",
    "scipy; python_version >= '3.11'",
]
tesseract = [
    "tesseract-core[runtime]; python_version >= '3.11'",
    "tesseract-jax; python_version >= '3.11'",
]
# The Gmsh tet mesher (cadjoint.fem.gmsh, and the cadjoint_tet_gmsh
# Tesseract): HXT second-order tets sized by the part, from the dual-contour
# surface as STL, instead of TetGen on a dual-contour quad soup.
#
# GPL-2.0-or-later, and an extra for that reason and no other. cadjoint is
# Apache-2.0; nothing under cadjoint/ imports gmsh at module scope, the
# built-in tetfill Tesseract stays the no-dependency fallback, and the
# supported production route is the cadjoint_tet_gmsh image, where the
# licence boundary is a process boundary. Installing this extra links Gmsh
# into your own process -- your call to make, knowingly.
#
# It overlaps the fem extra, which already pulls gmsh in because jax-fem
# imports it. That is not a reason to drop it: this extra is what the tet
# mesher declares it needs, and a caller who wants it should not have to
# install a solver stack to get it (or discover the dependency by accident).
gmsh = ["gmsh; python_version >= '3.11'"]
# Dev-only STEP validation: tests/meshing/test_step_kernel.py round-trips
# save_step output through the OCCT kernel (importorskip'd when absent).
# cadquery-ocp ships wheels for CPython 3.10-3.14 only, so the marker keeps
# uv's universal resolution working for the project's full >=3.9 range.
stepcheck = ["cadquery-ocp; python_version >= '3.10' and python_version < '3.15'"]
# The playground server's process monitor (`/api/jobs`) samples each worker
# subprocess's CPU and RSS through psutil. Without it the server still runs
# and still registers every job — it degrades to `resource.getrusage`
# totals over all children and says so in the payload's `sampling` field.
viewer = [
    "anywidget>=0.9.21",
    "psutil>=5.9",
]
# The playground editor's intelligence: `/api/lint` shells out to the ruff
# binary, and `/api/complete` / `/api/signature` drive jedi in-process. Both
# are optional — without them those endpoints answer with an install hint and
# the editor simply goes quiet.
editor = [
    "jedi>=0.19.0",
    "ruff>=0.8.0",
]
dev = [
    "pytest>=7.0.0",
    "pre-commit>=3.0.0",
    "matplotlib>=3.7.0",
]
docs = [
    "quartodoc>=0.7",
    "griffe<1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cadjoint*"]

# The playground UI is built from frontend/ into cadjoint/viewer/static and
# committed, so installing cadjoint needs no Node toolchain.
[tool.setuptools.package-data]
"cadjoint.viewer" = ["static/*", "static/**/*"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.8.0",
    "jedi>=0.19.0",
    "pre-commit>=3.0.0",
    "matplotlib>=3.7.0",
    "scikit-image>=0.21.0",
    "wgpu>=0.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "NPY",    # NumPy-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without explicit strict parameter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "SIM"]
"examples/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
