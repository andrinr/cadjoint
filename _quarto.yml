project:
  type: website
  output-dir: _site
  # Render an explicit list rather than every .md/.qmd in the tree: research/
  # holds working notes that are not part of the documentation site, and
  # stray READMEs (docs/assets/**/README.md) are not pages either.
  render:
    - index.qmd
    - docs/*.qmd
    - reference/*.qmd
  resources:
    - docs/assets/**

# Written by `quartodoc build` (see `quartodoc.sidebar` below): the API
# reference sidebar, one entry per section and object.
metadata-files:
  - reference/_sidebar.yml

website:
  title: cadjoint
  description: Differentiable CAD with JAX and SDFs
  favicon: docs/assets/logo.svg
  search:
    location: navbar
    type: overlay
    limit: 30
  navbar:
    logo: docs/assets/logo.svg
    logo-alt: cadjoint
    title: CADJOINT
    left:
      - text: Get started
        href: docs/getting-started.qmd
      - text: Guides
        href: docs/guides.qmd
      - text: Playground
        href: docs/viewer.qmd
      - text: API reference
        href: reference/index.qmd
    right:
      - icon: github
        href: https://github.com/andrinr/cadjoint
  sidebar:
    - id: guides
      title: Guides
      style: floating
      contents:
        - docs/guides.qmd
        - docs/modelling.qmd
        - docs/meshing.qmd
        - docs/simulation.qmd
        - docs/materials.qmd
        - docs/optimization.qmd
        - docs/rendering.qmd
        - docs/plugins.qmd
        - docs/flow.qmd
  page-footer:
    left: "cadjoint"
    right:
      - text: Research notes (GitHub)
        href: https://github.com/andrinr/cadjoint/tree/main/research

format:
  html:
    theme: [cosmo, docs/assets/cadjoint.scss, docs/assets/tokens.scss]
    highlight-style: none
    toc: true
    toc-depth: 2
    toc-location: left
    code-copy: true
    # One navigation panel: docs/assets/nav.html nests the page outline under
    # the current page's entry in the sidebar.
    include-after-body: docs/assets/nav.html

execute:
  enabled: false  # render stored outputs, don't re-execute

quartodoc:
  package: cadjoint
  dir: reference
  title: API reference
  parser: google
  # One page per object; the index lists each object with its one-line
  # docstring summary.  Objects are documented at the path a user imports
  # them from (`construction.extrude`, not `construction.extrude.extrude`).
  sidebar:
    file: reference/_sidebar.yml
    collapse-level: 1
  # quartodoc 0.11 renders every docstring section cadjoint uses except
  # Yields, and dies on the first generator or context manager it meets.
  # _quartodoc_renderer.py fills that one gap; drop it when upstream
  # renders Yields itself.
  renderer:
    style: _quartodoc_renderer.py
  sections:
    # -- Parameters & geometry ------------------------------------------------
    - title: Parameters and geometry
      desc: Scalar and vector parameters, and extraction of a tree's parameters.
    - subtitle: Parameters
      desc: Parameter types and helpers.
      contents:
        - geometry.Parameter
        - geometry.Scalar
        - geometry.Vector
        - geometry.Vector2
        - geometry.as_parameter
        - geometry.deduplicate_params
    - subtitle: Parameter extraction
      desc: Read free and fixed parameters from a tree; write values back.
      contents:
        - extract_parameters
        - apply_parameters

    # -- Sketches and construction -------------------------------------------
    - title: Sketches and construction
      desc: Sketch planes, 2D profiles, features that generate solids, and face references.
    - subtitle: Sketches
      desc: Work planes and closed polygon profiles.
      contents:
        - construction.SketchPlane
        - construction.PolygonProfile
    - subtitle: Features
      desc: Extrude, revolve and loft a profile into a solid.
      contents:
        - construction.extrude
        - construction.revolve
        - construction.loft
        - construction.Solid
        - construction.ConstructionPrimitive
    - subtitle: Face references
      desc: Faces and axes of generated solids, used to place sketch planes.
      contents:
        - construction.Face
        - construction.FaceSet
        - construction.Feature
        - construction.Axis

    # -- Constraints -----------------------------------------------------------
    - title: Constraints
      desc: Constraint types, the constraint solver, and degree-of-freedom analysis.
    - subtitle: Constraint types
      desc: One class per geometric relation.
      contents:
        - constraints.Constraint
        - constraints.DistanceConstraint
        - constraints.AngleConstraint
        - constraints.HorizontalConstraint
        - constraints.VerticalConstraint
        - constraints.CoincidentConstraint
        - constraints.FixedConstraint
        - constraints.EqualLengthConstraint
        - constraints.PointOnLineConstraint
        - constraints.ParallelConstraint
        - constraints.PerpendicularConstraint
        - constraints.ParallelEdgesConstraint
        - constraints.PerpendicularEdgesConstraint
    - subtitle: Solving and projection
      desc: Solve constraints and project parameters onto the constraint manifold or bounds.
      contents:
        - solve_constraints
        - constraints.satisfy_constraints
        - constraints.constraint_residuals
        - constraints.project_to_manifold
        - constraints.make_manifold_projection
        - constraints.project_bounds
        - constraints.make_bounds_projection
    - subtitle: Degrees of freedom
      desc: Residuals, parameter vectors and null-space maps.
      contents:
        - constraints.all_parameters
        - constraints.total_dof_reduction
        - constraints.build_residual_fn
        - constraints.compute_param_vector
