project:
  type: website
  output-dir: _site
  resources:
    - docs/assets/**

website:
  title: cadjoint
  description: Differentiable CAD with JAX and SDFs
  navbar:
    left:
      - text: Get Started
        href: docs/getting-started.qmd
      - text: Guides
        menu:
          - text: Differentiable Meshing
            href: docs/meshing.qmd
          - text: Simulation
            href: docs/simulation.qmd
          - text: Optimization
            href: docs/optimization.qmd
          - text: Tesseracts
            href: docs/tesseracts.qmd
          - text: "---"
          - text: Forward Renderer
            href: docs/rendering.qmd
      - text: Playground
        href: docs/viewer.qmd
      - text: Examples
        menu:
          - text: Basics
            href: examples/basics.ipynb
          - text: Rendering
            href: examples/rendering.ipynb
          - text: Sketch Construction
            href: examples/sketch_construction.ipynb
          - text: Constraints
            href: examples/constraints.ipynb
          - text: Optimization
            href: examples/optimization.ipynb
          - text: Constrained Optimization
            href: examples/constrained_optimization.ipynb
      - text: Research
        menu:
          - text: Differentiable meshing pipeline
            href: research/differentiable-meshing-pipeline.md
          - text: Native (Rust) dual-contouring core
            href: research/native-mesher.md
          - text: FEM integration
            href: research/fem-integration.md
          - text: Tet vs hex meshing
            href: research/tet-vs-hex.md
          - text: End-to-end optimization
            href: research/end-to-end-optimization.md
          - text: WebGPU SDF path tracing
            href: research/path-tracing.md
          - text: Simulator ecosystem survey
            href: research/simulator-ecosystem.md
          - text: Constraint system
            href: research/constraints.md
      - text: API Reference
        href: reference/index.qmd
    right:
      - icon: github
        href: https://github.com/andrinr/cadjoint

format:
  html:
    theme: cosmo
    toc: true
    toc-depth: 3
    code-copy: true

execute:
  enabled: false  # render stored outputs, don't re-execute

quartodoc:
  package: cadjoint
  dir: reference
  parser: google
  sections:
    - title: Parameter Extraction
      contents:
        - extraction.extract_parameters
    - title: Functionalize
      contents:
        - functionalize.functionalize
        - functionalize.functionalize_scene
    - title: Shader compilation
      contents:
        - backends.wgsl.codegen.compile_sdf_to_wgsl
        - backends.wgsl.codegen.compile_scene_to_wgsl
    - title: Parametrization
      contents:
        - parametrization.to_normalized
        - parametrization.from_normalized
        - parametrization.compute_param_scales
    - title: Constraints — types
      contents:
        - constraints.types.base.Constraint
        - constraints.types.distance.DistanceConstraint
        - constraints.types.angle.AngleConstraint
        - constraints.types.parallel.ParallelConstraint
        - constraints.types.perpendicular.PerpendicularConstraint
    - title: Constraints — solver
      contents:
        - constraints.solve.solve_constraints
        - constraints.solve.satisfy_constraints
        - constraints.solve.project_to_manifold
        - constraints.solve.constraint_residuals
        - constraints.solve.make_manifold_projection
    - title: Geometry
      contents:
        - geometry.parameters.Vector
        - geometry.parameters.Scalar
    - title: Meshing — extraction
      contents:
        - meshing.edge_detection.GridSpec
        - meshing.dual_contouring.Mesh
        - meshing.dual_contouring.extract_mesh
        - meshing.edge_detection.sample_grid
        - meshing.edge_detection.find_crossing_edges
        - meshing.edge_detection.edge_hermite_data
        - meshing.edge_detection.detect_edges
        - meshing.features.manifold_cell_incidence
        - meshing.features.classify_feature_cells
        # meshing.dual_contouring.qef_vertices — omitted: its wrapped
        # `Returns:` description crashes griffe's Google parser (each
        # same-indent line is read as another return value, then indexed
        # against the 2-tuple annotation). Re-add once the continuation
        # lines carry a hanging indent.
        - meshing.dual_contouring.sharp_qef_vertices
        - meshing.dual_contouring.dual_faces
    - title: Meshing — adaptive, simplify, native
      contents:
        - meshing.adaptive.surface_cells
        - meshing.adaptive.sparse_crossing_edges
        - meshing.simplify.simplify_mesh
        - meshing.native.native_available
        - meshing.native.extract_mesh_native
        - meshing.native.qef_vertices_native
    - title: Meshing — export and diagnostics
      contents:
        - meshing.export.save_obj
        - meshing.export.save_stl
        - meshing.export.save_step
        # meshing.export.merge_planar_faces — omitted for the same griffe
        # `Returns:` wrapping crash as meshing.dual_contouring.qef_vertices.
        - meshing.diagnostics.mesh_report
        - meshing.diagnostics.surface_deviation
        - meshing.diagnostics.triangle_quality
        - meshing.diagnostics.self_intersections
    - title: Simulation — meshes and studies
      contents:
        - fem.simmesh.SimMesh
        - fem.study.ThermalStudy
        - fem.study.ElasticStudy
        - fem.result.SimulationResult
    - title: Simulation — selections and BCs
      contents:
        - fem.selection.Nodes
        - fem.selection.NodeSelection
        - fem.study.Dirichlet
        - fem.study.HeatFlux
        - fem.study.Fixed
        - fem.study.Traction
    - title: Simulation — backends
      contents:
        - fem.backends.SolverBackend
        - fem.backends.get_backend
        - fem.backends.register_backend
        - fem.backends.available_backends
    - title: Optimization
      contents:
        - optimize.Optimization
        - optimize.OptimizationRun
        - optimize.capture_optimizations
    - title: Render
      contents:
        - render.scene.Camera
        - render.scene.Scene
        - render.settings.RenderSettings
        - render.raymarch.render.render_scene
        - render.raymarch.render.raymarch
        - render.raymarch.render.render_raymarched
