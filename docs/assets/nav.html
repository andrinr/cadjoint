<script>
// One navigation panel. On a page with a section sidebar (guides,
// reference) the page outline moves under the current page's entry; the
// entry gets the same collapse toggle as a sidebar section, and so does the
// standalone outline on pages without a sidebar. Moving the outline element
// keeps its id, so Quarto's scroll highlighting still works.
document.addEventListener("DOMContentLoaded", () => {
  const toc = document.querySelector("nav#TOC");
  const list = toc && toc.querySelector(":scope > ul");
  if (!toc || !list) return;

  // The same markup Quarto writes for a sidebar section's toggle, so it
  // takes the same chevron, rotation and Bootstrap collapse animation.
  const toggle = (target) => {
    const a = document.createElement("a");
    a.className = "sidebar-item-toggle text-start";
    a.setAttribute("data-bs-toggle", "collapse");
    a.setAttribute("data-bs-target", "#" + target);
    a.setAttribute("aria-expanded", "true");
    a.setAttribute("aria-label", "Toggle page outline");
    a.innerHTML = '<i class="bi bi-chevron-right ms-2"></i>';
    return a;
  };
  const collapsible = (id) => {
    const wrap = document.createElement("div");
    wrap.id = id;
    wrap.className = "collapse show";
    list.classList.remove("collapse");
    wrap.appendChild(list);
    return wrap;
  };

  const active = document.querySelector("#quarto-sidebar .sidebar-link.active");
  const item = active && active.closest(".sidebar-item");
  if (item) {
    toc.replaceChildren(collapsible("page-outline"));
    toc.classList.add("in-sidebar");
    item.appendChild(toc);
    item.querySelector(".sidebar-item-container").appendChild(toggle("page-outline"));
    document.body.classList.add("toc-in-sidebar");
    return;
  }
  const title = toc.querySelector("#toc-title");
  toc.appendChild(collapsible("page-outline"));
  if (title) {
    const head = document.createElement("div");
    head.className = "sidebar-item-container toc-head";
    title.replaceWith(head);
    head.append(title, toggle("page-outline"));
  }
});
</script>
